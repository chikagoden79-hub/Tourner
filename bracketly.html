<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Bracketly — Турниры</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --primary:#5B8DEF;
  --secondary:#8B5CF6;
  --accent:#22D3B4;
  --bg:#0B0E14;
  --card:#141822;
  --card2:#1B2130;
  --text:#E8EAED;
  --text-dim:#8891A3;
  --grid:#232838;
  --danger:#EF5D6F;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--card2);border:1px solid var(--grid);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--grid);border-radius:4px;}

#app{max-width:1100px;margin:0 auto;padding:16px 16px 100px;min-height:100vh;}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 20px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%, transparent);z-index:20;}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-family:'Space Grotesk';}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;border:1px solid var(--grid);}
.icon-btn:active{transform:scale(0.94);}
.topbar-actions{display:flex;gap:8px;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:11px;font-weight:600;font-size:15px;transition:transform .08s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--grid);}
.btn-accent{background:var(--accent);color:#06251f;}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-ghost{color:var(--text-dim);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}

/* ---------- Cards / Home ---------- */
.empty{text-align:center;padding:70px 20px;color:var(--text-dim);}
.empty .mark-lg{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:28px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.t-card{background:var(--card);border:1px solid var(--grid);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;}
.t-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.t-card .fmt-badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);background:var(--card2);padding:3px 8px;border-radius:6px;margin-bottom:8px;}
.t-card h3{font-size:17px;margin:0 0 4px;}
.t-card p{margin:0;font-size:13px;color:var(--text-dim);}
.t-card .status{position:absolute;top:14px;right:14px;font-size:11px;padding:3px 8px;border-radius:20px;}
.status.setup{background:#3a331a;color:#e0b84a;}
.status.ongoing{background:#1a3323;color:var(--accent);}
.status.completed{background:#1f2540;color:var(--secondary);}

/* ---------- Section header ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px;}
.section-head h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:0;}

/* ---------- Wizard ---------- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.fmt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.fmt-opt{background:var(--card);border:1.5px solid var(--grid);border-radius:12px;padding:14px 12px;text-align:left;}
.fmt-opt.active{border-color:var(--primary);background:var(--card2);}
.fmt-opt .fi{font-size:20px;margin-bottom:6px;}
.fmt-opt b{font-size:14px;display:block;margin-bottom:3px;}
.fmt-opt span{font-size:12px;color:var(--text-dim);}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:340px;overflow-y:auto;}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:8px 10px;}
.prow .seed{width:26px;height:26px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-dim);flex-shrink:0;}
.prow input{border:none;background:transparent;padding:4px;}
.prow .rm{color:var(--danger);flex-shrink:0;}
.dropzone{border:1.5px dashed var(--grid);border-radius:12px;padding:16px;text-align:center;color:var(--text-dim);font-size:13px;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:6px 12px;border-radius:20px;background:var(--card2);border:1px solid var(--grid);font-size:13px;}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ---------- Tournament view ---------- */
.t-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;}
.t-header h1{font-size:22px;margin:0;}
.t-sub{color:var(--text-dim);font-size:13px;margin-top:4px;}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:4px;margin:16px 0;overflow-x:auto;}
.tab{padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap;}
.tab.active{background:var(--primary);color:#fff;}

/* ---------- Bracket ---------- */
.bracket-scroll{overflow-x:auto;padding-bottom:20px;}
.bracket{display:flex;gap:46px;padding:10px 4px;}
.b-round{display:flex;flex-direction:column;justify-content:space-around;gap:18px;min-width:200px;position:relative;}
.b-round .rlabel{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-bottom:4px;}
.match{background:var(--card);border:1px solid var(--grid);border-radius:11px;overflow:hidden;position:relative;}
.match.done{border-color:var(--accent);}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;font-size:13.5px;gap:8px;}
.mrow:first-child{border-bottom:1px solid var(--grid);}
.mrow.winner{color:var(--accent);font-weight:600;}
.mrow .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.mrow .pname.tbd{color:var(--text-dim);font-style:italic;}
.mrow .score{width:26px;text-align:center;border-radius:6px;padding:3px 0;font-size:13px;background:var(--card2);}
.connector{position:absolute;right:-23px;top:0;bottom:0;width:23px;}
.connector::before{content:'';position:absolute;right:0;top:50%;width:23px;border-top:1.5px solid var(--grid);}
.gf-mark{font-size:11px;color:var(--secondary);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}

/* ---------- Tables ---------- */
table.std{width:100%;border-collapse:collapse;font-size:13.5px;}
table.std th{text-align:left;color:var(--text-dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--grid);}
table.std td{padding:9px 10px;border-bottom:1px solid var(--grid);}
table.std tr:last-child td{border-bottom:none;}
.rank-badge{width:20px;height:20px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);}
.card-box{background:var(--card);border:1px solid var(--grid);border-radius:var(--radius);padding:14px;margin-bottom:16px;}
.match-row-flat{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--grid);font-size:13.5px;}
.match-row-flat:last-child{border-bottom:none;}
.match-row-flat .side{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.match-row-flat .side.win{color:var(--accent);font-weight:600;}
.score-edit{display:flex;gap:6px;align-items:center;}
.score-edit input{width:44px;text-align:center;padding:6px 4px;}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px 30px;border-top:1px solid var(--grid);}
@media(min-width:640px){.overlay{align-items:center;}.sheet{border-radius:18px;max-height:88vh;}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.sheet-head h3{margin:0;font-size:18px;}

/* ---------- Theme editor ---------- */
.color-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--grid);}
.color-row:last-child{border-bottom:none;}
.color-row .cname{font-size:14px;}
.color-row .cname small{display:block;color:var(--text-dim);font-size:11px;}
.swatch-input{width:44px;height:32px;padding:0;border-radius:8px;border:1px solid var(--grid);background:none;cursor:pointer;}
.theme-chip-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;}
.theme-chip{flex-shrink:0;padding:8px 10px;border-radius:10px;border:1.5px solid var(--grid);background:var(--card);display:flex;align-items:center;gap:6px;font-size:12px;}
.theme-chip.active{border-color:var(--primary);}
.theme-chip .dot{width:14px;height:14px;border-radius:50%;}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-dim);}
.seg button.active{background:var(--primary);color:#fff;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--grid);padding:11px 18px;border-radius:12px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.fab-note{font-size:12px;color:var(--text-dim);line-height:1.5;}
.divider{height:1px;background:var(--grid);margin:18px 0;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================================
   BRACKETLY — единый файл приложения для управления турнирами
   Хранение: localStorage (гостевой режим, без регистрации)
   ========================================================================= */

/* ---------------------------- УТИЛИТЫ ---------------------------- */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const nextPow2 = n => { let p=1; while(p<n) p*=2; return Math.max(p,2); };
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Стандартный порядок посева для сетки на elimination (1v8, 4v5, 2v7, 3v6 ...)
function seedOrder(size){
  let order=[1,2];
  while(order.length<size){
    const sum = order.length*2+1;
    const next=[];
    for(const s of order){ next.push(s); next.push(sum-s); }
    order=next;
  }
  return order;
}

const SPORT_PRESETS = ['Футбол','Баскетбол','Волейбол','Настольный теннис','Шахматы','CS2','Dota 2','Valorant','FIFA/EA FC','Настольные игры','Другое'];

const FORMATS = {
  single: {label:'Single Elimination', icon:'🏆', desc:'На выбывание, один круг'},
  double: {label:'Double Elimination', icon:'🔁', desc:'На выбывание, две сетки'},
  group:  {label:'Групповой этап + плейофф', icon:'🗂️', desc:'Группы → сетка на вылет'},
  rr:     {label:'Round Robin', icon:'🔄', desc:'Каждый с каждым'},
  swiss:  {label:'Swiss System', icon:'♟️', desc:'Швейцарская система'}
};

/* ---------------------------- ХРАНИЛИЩЕ ---------------------------- */
const STORAGE_KEY = 'bracketly_data_v1';

const DEFAULT_THEME = {
  id:'default-dark', name:'Bracketly Dark', mode:'dark',
  colors:{primary:'#5B8DEF',secondary:'#8B5CF6',accent:'#22D3B4',bg:'#0B0E14',card:'#141822',text:'#E8EAED',grid:'#232838'}
};
const DEFAULT_THEME_LIGHT = {
  id:'default-light', name:'Bracketly Light', mode:'light',
  colors:{primary:'#3B6FE0',secondary:'#7C4DDB',accent:'#0EA894',bg:'#F5F6FA',card:'#FFFFFF',text:'#161A22',grid:'#E3E6ED'}
};

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { tournaments:{}, themes:{[DEFAULT_THEME.id]:DEFAULT_THEME,[DEFAULT_THEME_LIGHT.id]:DEFAULT_THEME_LIGHT}, activeThemeId:DEFAULT_THEME.id };
}
let DATA = loadData();
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }

/* ---------------------------- ГЛОБАЛЬНОЕ СОСТОЯНИЕ UI ---------------------------- */
let VIEW = 'home';           // home | create | tournament | theme
let CURRENT_ID = null;       // id открытого турнира
let CURRENT_TAB = 'bracket'; // bracket | standings | matches | settings
let WIZARD = null;           // временное состояние создания турнира
let MODAL = null;            // 'theme' | null

/* ---------------------------- ПРИМЕНЕНИЕ ТЕМЫ ---------------------------- */
function applyTheme(theme){
  const c = theme.colors;
  const r = document.documentElement.style;
  r.setProperty('--primary',c.primary); r.setProperty('--secondary',c.secondary);
  r.setProperty('--accent',c.accent); r.setProperty('--bg',c.bg);
  r.setProperty('--card',c.card);
  r.setProperty('--card2', theme.mode==='light' ? shade(c.card,-4) : shade(c.card,8));
  r.setProperty('--text',c.text); r.setProperty('--grid',c.grid);
  r.setProperty('--text-dim', theme.mode==='light' ? shade(c.text,55) : shade(c.text,-45));
  document.querySelector('meta[name=theme-color]').setAttribute('content', c.bg);
}
function shade(hex, percent){ // светлее/темнее для служебных производных цветов
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  let [r,g,b] = [0,2,4].map(i=>parseInt(hex.substr(i,2),16));
  const amt = Math.round(2.55*percent);
  [r,g,b] = [r,g,b].map(v=>clamp(v+amt,0,255));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function activeTheme(t){
  const th = t && t.themeOverride && DATA.themes[t.themeOverride] ? DATA.themes[t.themeOverride] : DATA.themes[DATA.activeThemeId];
  return th || DEFAULT_THEME;
}

/* =========================================================================
   ГЕНЕРАТОРЫ ФОРМАТОВ — все читают результаты из tournament.results
   и детерминированно пересчитывают сетку/таблицу на каждый рендер.
   ========================================================================= */

// ---------- SINGLE ELIMINATION ----------
function computeSingleElim(participants, results, keyPrefix='WB'){
  const size = nextPow2(participants.length);
  const order = seedOrder(size);
  let slots = order.map(seed => participants[seed-1] || null);
  const rounds = [];
  let round = 1;
  while(slots.length > 1){
    const matches = [];
    for(let i=0;i<slots.length;i+=2){
      const p1 = slots[i], p2 = slots[i+1];
      const key = `${keyPrefix}-${round}-${i/2}`;
      const res = results[key] || {};
      let winner=null, bye=false;
      if(p1 && !p2){ winner=p1; bye=true; }
      else if(!p1 && p2){ winner=p2; bye=true; }
      else if(p1 && p2 && res.s1!=null && res.s2!=null && res.s1!==res.s2){
        winner = res.s1>res.s2 ? p1 : p2;
      }
      matches.push({key, round, p1, p2, s1:res.s1??null, s2:res.s2??null, winner, bye});
    }
    rounds.push(matches);
    slots = matches.map(m=>m.winner);
    round++;
  }
  return rounds; // rounds[last][0].winner = чемпион (если решено)
}

// ---------- DOUBLE ELIMINATION ----------
// Упрощённая, но рабочая структура: WB как single-elim; проигравшие поочерёдно
// "падают" в LB через раунды выживания/дропа; финал WB-чемпион vs LB-чемпион,
// с матчем-реваншем (bracket reset), если побеждает представитель LB.
function computeDoubleElim(participants, results){
  const wb = computeSingleElim(participants, results, 'WB');
  const k = wb.length; // число раундов WB

  // проигравшие по раундам WB (bracket order)
  const losersByRound = wb.map(roundMatches => roundMatches.map(m=>{
    if(!m.winner) return null;
    if(m.bye) return null; // при бае проигравшего нет
    return m.p1===m.winner ? m.p2 : m.p1;
  }).filter(x=>x!==null));

  const lbRounds = [];
  let survivors = null;
  let lbNum = 1;
  const pairAndRecord = (list, roundNum) => {
    const matches=[];
    for(let i=0;i<list.length;i+=2){
      const p1=list[i], p2=list[i+1]??null;
      const key=`LB-${roundNum}-${i/2}`;
      const res=results[key]||{};
      let winner=null;
      if(p1 && !p2) winner=p1;
      else if(p1 && p2 && res.s1!=null && res.s2!=null && res.s1!==res.s2) winner = res.s1>res.s2?p1:p2;
      matches.push({key, round:roundNum, p1, p2, s1:res.s1??null, s2:res.s2??null, winner, bye:!p2});
    }
    lbRounds.push(matches);
    return matches.map(m=>m.winner);
  };
  const pairDropAndRecord = (survList, dropList, roundNum) => {
    const matches=[];
    const n = Math.max(survList.length, dropList.length);
    for(let i=0;i<n;i++){
      const p1=survList[i]??null, p2=dropList[i]??null;
      const key=`LB-${roundNum}-${i}`;
      const res=results[key]||{};
      let winner=null;
      if(p1 && !p2) winner=p1; else if(!p1 && p2) winner=p2;
      else if(p1 && p2 && res.s1!=null && res.s2!=null && res.s1!==res.s2) winner = res.s1>res.s2?p1:p2;
      matches.push({key, round:roundNum, p1, p2, s1:res.s1??null, s2:res.s2??null, winner, bye:!p1||!p2});
    }
    lbRounds.push(matches);
    return matches.map(m=>m.winner).filter(x=>x!==undefined);
  };

  for(let r=1; r<=k; r++){
    const losers = losersByRound[r-1] || [];
    if(losers.length===0) continue;
    if(survivors===null){
      survivors = pairAndRecord(losers, lbNum++);
    } else {
      survivors = pairDropAndRecord(survivors, losers, lbNum++);
      if(survivors.length>1) survivors = pairAndRecord(survivors, lbNum++);
    }
  }
  const lbChampion = survivors && survivors.length===1 ? survivors[0] : (survivors? survivors.find(Boolean):null);
  const wbChampion = wb.length ? wb[wb.length-1][0].winner : null;

  // Гранд-финал
  const gfKey='GF-1';
  const gfRes = results[gfKey]||{};
  let gfWinner=null;
  if(wbChampion && lbChampion && gfRes.s1!=null && gfRes.s2!=null && gfRes.s1!==gfRes.s2){
    gfWinner = gfRes.s1>gfRes.s2 ? wbChampion : lbChampion;
  }
  const gf1 = {key:gfKey, p1:wbChampion, p2:lbChampion, s1:gfRes.s1??null, s2:gfRes.s2??null, winner:gfWinner};
  let gf2 = null;
  if(gfWinner && gfWinner===lbChampion){ // реванш нужен
    const gf2Res = results['GF-2']||{};
    let w2=null;
    if(gf2Res.s1!=null && gf2Res.s2!=null && gf2Res.s1!==gf2Res.s2) w2 = gf2Res.s1>gf2Res.s2 ? wbChampion : lbChampion;
    gf2 = {key:'GF-2', p1:wbChampion, p2:lbChampion, s1:gf2Res.s1??null, s2:gf2Res.s2??null, winner:w2};
  }
  const champion = gf2 ? gf2.winner : (gfWinner===wbChampion ? wbChampion : null);
  return {wb, lb:lbRounds, gf1, gf2, champion};
}

// ---------- ROUND ROBIN (метод круга) ----------
function rrSchedule(n){
  let list=[...Array(n).keys()];
  if(n%2!==0) list.push(-1);
  const rounds=[];
  const total=list.length;
  let arr=[...list];
  for(let r=0;r<total-1;r++){
    const round=[];
    for(let i=0;i<total/2;i++){
      const a=arr[i], b=arr[total-1-i];
      if(a!==-1 && b!==-1) round.push([a,b]);
    }
    rounds.push(round);
    const fixed=arr[0], rest=arr.slice(1);
    rest.unshift(rest.pop());
    arr=[fixed,...rest];
  }
  return rounds;
}
function computeRoundRobin(participants, results, keyPrefix='RR'){
  const idx = rrSchedule(participants.length);
  const rounds = idx.map((round,ri)=> round.map(([a,b],mi)=>{
    const p1=participants[a], p2=participants[b];
    const key=`${keyPrefix}-${ri}-${mi}`;
    const res=results[key]||{};
    let winner=null, draw=false;
    if(res.s1!=null && res.s2!=null){
      if(res.s1===res.s2) draw=true; else winner = res.s1>res.s2?p1:p2;
    }
    return {key, p1, p2, s1:res.s1??null, s2:res.s2??null, winner, draw};
  }));
  return rounds;
}
function standingsFromMatches(participants, flatMatches){
  const table = {};
  participants.forEach(p=> table[p.id] = {p, w:0,d:0,l:0,pts:0,played:0,sf:0,sa:0});
  flatMatches.forEach(m=>{
    if(!m.p1 || !m.p2 || m.s1==null || m.s2==null) return;
    const A=table[m.p1.id], B=table[m.p2.id];
    if(!A||!B) return;
    A.played++; B.played++; A.sf+=m.s1; A.sa+=m.s2; B.sf+=m.s2; B.sa+=m.s1;
    if(m.s1===m.s2){ A.d++; B.d++; A.pts+=1; B.pts+=1; }
    else if(m.s1>m.s2){ A.w++; A.pts+=3; B.l++; }
    else { B.w++; B.pts+=3; A.l++; }
  });
  return Object.values(table).sort((x,y)=> y.pts-x.pts || (y.sf-y.sa)-(x.sf-x.sa) || y.sf-x.sf);
}

// ---------- SWISS SYSTEM ----------
// Пары раундов хранятся явно в tournament.swiss.rounds (генерируются пошагово,
// так как зависят от текущей таблицы, а не только от структуры турнира).
function swissStandings(participants, allRounds){
  const flat = allRounds.flat();
  return standingsFromMatches(participants, flat);
}
function generateSwissRound(tournament){
  const participants = tournament.participants;
  const results = tournament.results;
  const prevRounds = tournament.swiss.rounds.map((r,ri)=> r.map((m,mi)=>{
    const key=`SW-${ri}-${mi}`; const res=results[key]||{};
    return {...m, s1:res.s1??null, s2:res.s2??null,
      winner: (res.s1!=null && res.s2!=null && res.s1!==res.s2) ? (res.s1>res.s2?m.p1:m.p2) : null};
  }));
  const standings = swissStandings(participants, prevRounds);
  const playedPairs = new Set();
  prevRounds.flat().forEach(m=> m.p1 && m.p2 && playedPairs.add([m.p1.id,m.p2.id].sort().join('|')));

  const pool = standings.map(s=>s.p).slice(); // сортировано по очкам
  const round = [];
  const used = new Set();
  for(let i=0;i<pool.length;i++){
    const a = pool[i];
    if(used.has(a.id)) continue;
    used.add(a.id);
    let opIdx=-1;
    for(let j=i+1;j<pool.length;j++){
      const b=pool[j];
      if(used.has(b.id)) continue;
      const pairKey=[a.id,b.id].sort().join('|');
      if(!playedPairs.has(pairKey)){ opIdx=j; break; }
    }
    if(opIdx===-1){ for(let j=i+1;j<pool.length;j++){ if(!used.has(pool[j].id)){ opIdx=j; break; } } }
    if(opIdx>=0){ used.add(pool[opIdx].id); round.push({p1:a,p2:pool[opIdx]}); }
    else { round.push({p1:a,p2:null}); } // бай для нечётного количества
  }
  tournament.swiss.rounds.push(round);
}

function createTournamentFromWizard(){
  const w = WIZARD;
  const participants = w.participants.map((name,i)=>({id:uid(), name, seed:i+1, color: pastel(i)}));
  const t = {
    id: uid(), name: w.name || 'Без названия', description: w.description||'', sport: w.sport,
    format: w.format, participants, results:{}, status:'ongoing', themeOverride:null, createdAt: Date.now()
  };
  if(w.format==='group'){
    const groupCount = clamp(Math.round(participants.length/4),2,8);
    const groups = Array.from({length:groupCount},()=>[]);
    participants.forEach((p,i)=> groups[i%groupCount].push(p)); // snake-подобное распределение
    t.groups = groups.map(g=>g.map(p=>p.id));
    t.playoffGenerated = false;
    t.advancePerGroup = 2;
  }
  if(w.format==='swiss'){
    t.swiss = { rounds: [], totalRounds: Math.max(3, Math.ceil(Math.log2(participants.length||2))) };
  }
  DATA.tournaments[t.id] = t;
  save();
  return t.id;
}
function pastel(i){
  const hues=[210,265,165,20,330,55,190,300];
  return `hsl(${hues[i%hues.length]} 70% 60%)`;
}
function setResult(t, key, s1, s2){
  t.results[key] = {s1, s2};
  save();
}
function deleteTournament(id){ delete DATA.tournaments[id]; save(); }

function renderStandingsView(t){

function flatMatchRow(m, keyOverride){
  const key = m.key || keyOverride;
  const editable = m.p1 && m.p2;
  return `<div class="match-row-flat">

function renderSwissView(t){
  const rounds = t.swiss.rounds;
  const canGenNext = rounds.length < t.swiss.totalRounds && (rounds.length===0 || isSwissRoundComplete(t, rounds.length-1));
  let html = rounds.map((round,ri)=>{
    const withKeys = round.map((m,mi)=>{
      const key=`SW-${ri}-${mi}`; const res=t.results[key]||{};
      let winner=null;
      if(!m.p2) winner=m.p1;
      else if(res.s1!=null && res.s2!=null && res.s1!==res.s2) winner = res.s1>res.s2?m.p1:m.p2;
      return {key,p1:m.p1,p2:m.p2,s1:res.s1??null,s2:res.s2??null,winner};
    });
    return `<div class="card-box">
      <div style="font-weight:600;margin-bottom:6px;color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em">Раунд ${ri+1}</div>
      ${withKeys.map(m=> m.p2 ? flatMatchRow(m) : `<div class="match-row-flat"><span class="side win">${esc(m.p1.name)}</span><span style="color:var(--text-dim);font-size:12px">бай — техническая победа</span><span></span></div>`).join('')}
    </div>`;
  }).join('');
  html += `<button class="btn btn-primary btn-block" ${canGenNext?'':'disabled style="opacity:.4"'} onclick="genSwissRound()">
    ${rounds.length===0?'Начать раунд 1':'Сгенерировать раунд '+(rounds.length+1)}</button>`;
  if(rounds.length>0 && !canGenNext && rounds.length<t.swiss.totalRounds) html += `<div class="fab-note" style="text-align:center;margin-top:8px">Заполните все результаты текущего раунда, чтобы продолжить</div>`;
  return html;
}
function isSwissRoundComplete(t, ri){
  const round = t.swiss.rounds[ri];
  return round.every((m,mi)=>{
    if(!m.p2) return true;
    const res = t.results[`SW-${ri}-${mi}`];
    return res && res.s1!=null && res.s2!=null;
  });
}
function genSwissRound(){ const t=DATA.tournaments[CURRENT_ID]; generateSwissRound(t); save(); render(); }

function renderGroupsView(t){
  const groupNames = 'ABCDEFGH';
  return `<div class="group-grid">
    ${t.groups.map((ids,gi)=>{
      const parts = ids.map(id=>t.participants.find(p=>p.id===id));
      const rounds = computeRoundRobin(parts, t.results, 'GRP'+gi);
      const flat = rounds.flat();
      const standings = standingsFromMatches(parts, flat);
      return `<div class="card-box">
        <div style="font-weight:700;margin-bottom:10px">Группа ${groupNames[gi]}</div>
        ${standingsTable(standings)}
        <div style="margin-top:12px">
          ${rounds.map((round,ri)=>round.map(m=>flatMatchRow(m)).join('')).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>
  <button class="btn btn-accent btn-block" style="margin-top:16px" onclick="genPlayoff()">Сформировать плейофф из лучших ${t.advancePerGroup} каждой группы</button>`;
}
function genPlayoff(){
  const t = DATA.tournaments[CURRENT_ID];
  const groupNames = 'ABCDEFGH';
  const advancers=[];
  t.groups.forEach((ids)=>{
    const parts = ids.map(id=>t.participants.find(p=>p.id===id));
    const idx = t.groups.indexOf(ids);
    const rounds = computeRoundRobin(parts, t.results, 'GRP'+idx);
    const standings = standingsFromMatches(parts, rounds.flat());
    advancers.push(...standings.slice(0,t.advancePerGroup).map(s=>s.p));
  });
  t.playoffParticipants = advancers.map((p,i)=>({...p, seed:i+1}));
  t.playoffGenerated = true;
  save(); CURRENT_TAB='playoff'; render();
}
function renderGroupPlayoffView(t){
  if(!t.playoffGenerated) return `<div class="empty"><p>Сначала завершите групповой этап и нажмите «Сформировать плейофф» на вкладке «Группы».</p></div>`;
  const rounds = computeSingleElim(t.playoffParticipants, t.results, 'PO');
  return renderSingleElimView(t, rounds);
}

function renderTournamentSettings(t){
  const themeChips = Object.values(DATA.themes).map(th=>`
    <button class="theme-chip ${t.themeOverride===th.id?'active':''}" onclick="setTournamentTheme('${th.id}')">
      <span class="dot" style="background:${th.colors.primary}"></span>${esc(th.name)}</button>`).join('');
  return `
  <div class="card-box">
    <div class="field" style="margin-bottom:12px"><label>Описание</label><p style="margin:0;font-size:14px;color:var(--text-dim)">${esc(t.description)||'—'}</p></div>
    <div class="field" style="margin-bottom:0"><label>Своя цветовая тема для этого турнира</label>
      <div class="theme-chip-row">
        <button class="theme-chip ${!t.themeOverride?'active':''}" onclick="setTournamentTheme(null)">По умолчанию</button>
        ${themeChips}
      </div>
      <button class="btn btn-secondary btn-sm" onclick="openThemeModal()">🎨 Редактировать темы</button>
    </div>
  </div>
  <div class="card-box">
    <label style="display:block;margin-bottom:10px;color:var(--text-dim);font-size:13px">Совместная работа и публикация</label>
    <button class="btn btn-secondary btn-block" onclick="exportTournament()">⬇️ Экспортировать турнир (JSON)</button>
    <div class="fab-note" style="margin-top:10px">Публичная ссылка, QR-код и live-режим для зрителей появятся в следующей версии — потребуется облачный бэкенд (Firebase/Supabase).</div>
  </div>
  <button class="btn btn-danger btn-block" onclick="confirmDelete('${t.id}')">Удалить турнир</button>`;
}
function setTournamentTheme(id){ const t=DATA.tournaments[CURRENT_ID]; t.themeOverride=id; save(); render(); }
function exportTournament(){
  const t = DATA.tournaments[CURRENT_ID];
  const blob = new Blob([JSON.stringify(t,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${t.name.replace(/\s+/g,'_')}.json`; a.click();
  toast('Файл турнира сохранён');
}
function confirmDelete(id){ if(confirm('Удалить турнир без возможности восстановления?')){ deleteTournament(id); goHome(); } }

/* ---------------- THEME MODAL ---------------- */
function openThemeModal(){ MODAL='theme'; TEMP_THEME = JSON.parse(JSON.stringify(DATA.themes[DATA.activeThemeId])); render(); }
function closeModal(){ MODAL=null; TEMP_THEME=null; render(); }
let TEMP_THEME = null;
const COLOR_FIELDS = [
  ['primary','Основной цвет','кнопки, акценты действий'],
  ['secondary','Дополнительный цвет','вторичные элементы'],
  ['accent','Акцентный цвет','победители, успех'],
  ['bg','Фон','фон приложения'],
  ['card','Карточки','фон карточек и блоков'],
  ['text','Текст','основной цвет текста'],
  ['grid','Сетка/границы','линии, разделители, рамки']
];
function renderThemeModal(){
  const th = TEMP_THEME;
  const saved = Object.values(DATA.themes);
  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet">
      <div class="sheet-head"><h3>Цветовая тема</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>

      <div class="seg" style="margin-bottom:16px">
        <button class="${th.mode==='dark'?'active':''}" onclick="setThemeMode('dark')">🌙 Тёмная</button>
        <button class="${th.mode==='light'?'active':''}" onclick="setThemeMode('light')">☀️ Светлая</button>
      </div>

      <div class="theme-chip-row">
        ${saved.map(s=>`<button class="theme-chip ${DATA.activeThemeId===s.id?'active':''}" onclick="loadThemeIntoEditor('${s.id}')">
          <span class="dot" style="background:${s.colors.primary}"></span>${esc(s.name)}
          ${!['default-dark','default-light'].includes(s.id)?`<span onclick="event.stopPropagation();deleteTheme('${s.id}')" style="color:var(--danger);margin-left:4px">✕</span>`:''}
        </button>`).join('')}
      </div>

      <div class="card-box" style="margin-top:4px">
        ${COLOR_FIELDS.map(([key,label,hint])=>`
          <div class="color-row">
            <div class="cname">${label}<small>${hint}</small></div>
            <input class="swatch-input" type="color" value="${th.colors[key]}" oninput="setThemeColor('${key}',this.value)">
          </div>`).join('')}
      </div>

      <div class="field">
        <label>Название темы</label>
        <input value="${esc(th.name)}" oninput="TEMP_THEME.name=this.value">
      </div>

      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-secondary" onclick="exportTheme()">⬇️ Экспорт</button>
        <button class="btn btn-secondary" onclick="importThemePrompt()">⬆️ Импорт</button>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="saveAndApplyTheme()">Сохранить и применить</button>
    </div>
  </div>`;
}
function setThemeMode(mode){ TEMP_THEME.mode=mode; render(); previewTheme(); }
function setThemeColor(key,val){ TEMP_THEME.colors[key]=val; previewTheme(); const chip=document.querySelector('.sheet .theme-chip-row'); }
function previewTheme(){ applyTheme(TEMP_THEME); }
function loadThemeIntoEditor(id){ TEMP_THEME = JSON.parse(JSON.stringify(DATA.themes[id])); render(); previewTheme(); }
function deleteTheme(id){ delete DATA.themes[id]; if(DATA.activeThemeId===id) DATA.activeThemeId='default-dark'; save(); render(); }
function saveAndApplyTheme(){
  if(!TEMP_THEME.id || Object.values(DATA.themes).filter(t=>t.name===TEMP_THEME.name).length>1){ /* keep id */ }
  if(!DATA.themes[TEMP_THEME.id]) TEMP_THEME.id = uid();
  DATA.themes[TEMP_THEME.id] = TEMP_THEME;
  DATA.activeThemeId = TEMP_THEME.id;
  save(); closeModal(); toast('Тема применена');
}
function exportTheme(){
  const blob = new Blob([JSON.stringify(TEMP_THEME,null,2)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${TEMP_THEME.name.replace(/\s+/g,'_')}_theme.json`; a.click();
}
function importThemePrompt(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{ const parsed = JSON.parse(ev.target.result);
        if(parsed.colors){ parsed.id = uid(); TEMP_THEME = parsed; render(); previewTheme(); toast('Тема импортирована'); }
        else toast('Некорректный файл темы');
      }catch(err){ toast('Не удалось прочитать файл'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

/* ---------------- TOAST ---------------- */
let toastTimer=null;
function toast(msg){
  clearTimeout(toastTimer);
  let el = document.querySelector('.toast');
  if(!el){ el=document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  toastTimer = setTimeout(()=>el.remove(), 2400);
}

/* ---------------- INIT ---------------- */
applyTheme(DATA.themes[DATA.activeThemeId] || DEFAULT_THEME);
render();
</script>
